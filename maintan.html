<script>
    // 1. Define the Global End Time in UTC
    // This is Feb 17, 2026, at 10:00 AM IST (which is 04:30:00 UTC)
    const MAINTENANCE_END_TIME = "2026-02-22T10:50:00Z"; 
    
    const REDIRECT_URL = "index.html"; 

    function updateSyncTimer() {
        const timerElement = document.getElementById("timer");
        
        // Date.parse() with "Z" at the end forces UTC on all browsers
        const target = Date.parse(MAINTENANCE_END_TIME);
        const now = new Date().getTime();
        const distance = target - now;

        if (distance <= 0) {
            timerElement.innerHTML = "00:00";
            window.location.href = REDIRECT_URL;
            return;
        }

        const mins = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const secs = Math.floor((distance % (1000 * 60)) / 1000);

        timerElement.innerHTML = 
            (mins < 10 ? "0" : "") + mins + ":" + 
            (secs < 10 ? "0" : "") + secs;
    }

    setInterval(updateSyncTimer, 1000);
    updateSyncTimer(); 
</script>
